<style>
  :root{
    --paper:#f6f3ec;
    --ink:#232733;
    --ink-soft:#5b5f6b;
    --card:#ffffff;
    --line:#e3ddd0;
    --shadow: 0 8px 24px rgba(35,39,51,0.08);
    --miori:#f0609a;
    --miori-soft:#fdedf4;
    --haruma:#3e9be0;
    --haruma-soft:#eaf5fd;
    --kazoku:#4caf6e;
    --kazoku-soft:#eaf7ee;
    --navy:#233255;
    --holiday:#d6455a;
  }
  *{box-sizing:border-box; min-width:0;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    overflow-x:hidden;
    background: var(--paper);
    font-family: "Hiragino Kaku Gothic ProN","Hiragino Sans", sans-serif;
    color:var(--ink);
    padding: 16px 10px 50px;
  }
  .wrap{max-width:920px;margin:0 auto; width:100%;}
  header{ text-align:center; margin-bottom: 12px; }
  h1{
    font-size: clamp(17px, 4vw, 22px);
    margin: 0; color: var(--ink); font-weight: 800;
  }
  .sub{
    font-size: 11.5px; color: var(--ink-soft); margin-top: 4px;
  }

  .month-nav{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin: 16px 0 12px;
  }
  .month-nav button{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .month-nav button:active{ transform: scale(.94); }
  .month-label{ font-size:17px; font-weight:800; min-width:120px; text-align:center; }

  .member-toggle{
    display:flex; justify-content:center; gap:8px; margin-bottom: 14px;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
    padding: 7px 14px; border-radius:999px; font-size:13px; font-weight:700;
    cursor:pointer; transition: all .15s ease; opacity:.5;
  }
  .chip.on{ opacity:1; color:#fff; }
  .chip.miori.on{ background:var(--miori); border-color:var(--miori); }
  .chip.haruma.on{ background:var(--haruma); border-color:var(--haruma); }
  .chip.kazoku.on{ background:var(--kazoku); border-color:var(--kazoku); }
  .chip .dot{ width:9px; height:9px; border-radius:50%; background:currentColor; display:inline-block; flex-shrink:0; }
  .chip.miori:not(.on) .dot{ background:var(--miori); }
  .chip.haruma:not(.on) .dot{ background:var(--haruma); }
  .chip.kazoku:not(.on) .dot{ background:var(--kazoku); }
  .chip.on .dot{ background:#fff; }

  .grid{
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
    padding: 8px; border: 1px solid var(--line); width:100%; overflow:hidden;
  }
  .weekdays{
    display:grid; grid-template-columns: repeat(7, minmax(0,1fr));
    font-size: 11px; color: var(--ink-soft); margin-bottom: 6px;
  }
  .weekdays div{text-align:center;padding:4px 0;font-weight:700;}
  .weekdays div:first-child{color:var(--miori);}
  .weekdays div:last-child{color:var(--haruma);}
  .days{ display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 3px; width:100%; }
  .day{
    min-height: 82px;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 3px 4px;
    cursor:pointer; background: #fffdf9;
    transition: transform .1s ease, box-shadow .1s ease;
    display:flex; flex-direction:column; gap:2px; position:relative;
  }
  .day:hover{ transform: translateY(-1px); box-shadow: 0 4px 10px rgba(35,39,51,.10); }
  .day.empty{ background:transparent; border:none; cursor:default; }
  .day.empty:hover{ transform:none; box-shadow:none; }
  .day .num{
    font-size: 11.5px; font-weight:800; color: var(--ink);
    width:18px; height:18px; line-height:18px; text-align:center;
  }
  .day.sun .num{color:var(--miori);}
  .day.sat .num{color:var(--haruma);}
  .day.holiday .num{color:var(--holiday);}
  .holiday-label{
    font-size: 7.5px; font-weight:700; color: var(--holiday);
    line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .day.today{ box-shadow: 0 0 0 2px var(--ink) inset; }
  .day.today .num{ background: var(--ink); color:#fff !important; border-radius:50%; }
  .pill{
    font-size: 8.3px; font-weight:700; line-height:1.25;
    padding: 1.5px 4px; border-radius: 5px; color:#fff;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pill.miori{ background: var(--miori); }
  .pill.haruma{ background: var(--haruma); }
  .pill.kazoku{ background: var(--kazoku); }
  .pill.off{ opacity:.55; }
  .more{ font-size:7.8px; color:var(--ink-soft); padding-left:2px; }

  .overlay{
    position:fixed; inset:0; background: rgba(35,39,51,.45);
    display:none; align-items:center; justify-content:center; padding: 20px; z-index: 50;
  }
  .overlay.show{display:flex;}
  .modal{
    background: var(--card); border-radius: 16px; max-width: 440px; width:100%;
    max-height: 82vh; overflow-y:auto; padding: 22px 22px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); position:relative;
  }
  .modal .close{
    position:absolute; top:10px; right:10px;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background:#f1ede4;border:none;
    font-size:22px;color:var(--ink-soft);cursor:pointer;
    border-radius:50%;
  }
  .modal h2{ margin:0 0 3px; font-size: 19px; color:var(--ink); }
  .modal .wd{ font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .block{
    margin-bottom: 12px;
    padding: 10px 12px; border-radius: 10px; border-left: 4px solid var(--ink);
  }
  .block.miori{ border-left-color: var(--miori); background: var(--miori-soft); }
  .block.haruma{ border-left-color: var(--haruma); background: var(--haruma-soft); }
  .block.kazoku{ border-left-color: var(--kazoku); background: var(--kazoku-soft); }
  .block.school{ border-left-color: var(--navy); background:#eef1f7; }
  .block.holiday{ border-left-color: var(--holiday); background:#fdecee; }
  .block.holiday .label{ color: var(--holiday); }
  .block .label{
    font-size: 11px; font-weight:800; letter-spacing:.03em; margin-bottom: 4px;
  }
  .block.miori .label{ color: var(--miori); }
  .block.haruma .label{ color: var(--haruma); }
  .block.kazoku .label{ color: var(--kazoku); }
  .block .txt{ font-size: 13.5px; line-height:1.6; color: var(--ink); white-space:pre-line; }
  .empty-msg{ font-size: 13px; color: var(--ink-soft); text-align:center; padding: 10px 0; }
  .day-nav{
    display:flex; justify-content:space-between; gap:8px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .nav-btn{
    flex:1;
    font-size: 13px; font-weight:700;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor:pointer;
  }
  .nav-btn:active{ background: var(--paper); }
  footer{
    text-align:center; margin-top: 20px; font-size: 11px; color: var(--ink-soft); line-height:1.7;
  }
</style>

<div class="wrap">

    <button class="chip kazoku on" id="chip-kazoku" onclick="toggleMember('kazoku')"><i class="dot"></i>家族</button>
  </div>

  <div class="grid">
    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="days" id="days"></div>
  </div>

  <footer>
    日付をタップすると、その日の美織・春馬それぞれの予定を詳しく確認できます。
  </footer>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modal"></div>
</div>

const MEMBER_KEYS = ['miori','haruma','kazoku'];
const MONTHS = [7,8,9,10];

// 2026年 日本の祝日（7〜9月分）
const HOLIDAYS = {
  7: { 20: '海の日' },
  8: { 11: '山の日' },
  9: { 21: '敬老の日', 22: '国民の休日', 23: '秋分の日' },
};
const MONTH_YEAR = 2026;

function getRealToday(){
  const now = new Date();
  return { y: now.getFullYear(), m: now.getMonth()+1, d: now.getDate() };
}
const REAL_TODAY = getRealToday();
let currentMonth = (REAL_TODAY.y===MONTH_YEAR && MONTHS.includes(REAL_TODAY.m)) ? REAL_TODAY.m : MONTHS[0];

let activeMembers = { miori:true, haruma:true, kazoku:true };

function toggleMember(key){
  activeMembers[key] = !activeMembers[key];
  document.getElementById('chip-'+key).classList.toggle('on', activeMembers[key]);
  render();
}

function changeMonth(delta){
  const idx = MONTHS.indexOf(currentMonth);
  currentMonth = MONTHS[(idx + delta + MONTHS.length) % MONTHS.length];
  render();
}

function getEventsForDay(day){
  const items = [];
  MEMBER_KEYS.forEach(key=>{
    const person = PEOPLE[key];
    const monthData = person.data[currentMonth];
    if(!monthData) return;
    const ev = monthData.events[day];
    if(!ev || !ev.sakura) return;
    items.push({ key, person, ev });
  });
  return items;
}

function render(){
  document.getElementById('monthLabel').textContent = MONTH_YEAR + '年 ' + currentMonth + '月';
  const wrap = document.getElementById('days');
  wrap.innerHTML = '';
  // いずれかにその月のデータがあれば日数・開始曜日を採用（美織を基準に、なければ他を参照）
  const ref = PEOPLE.miori.data[currentMonth] || PEOPLE.haruma.data[currentMonth] || PEOPLE.kazoku.data[currentMonth];
  for(let i=0;i<ref.startWeekday;i++){
    const d = document.createElement('div');
    d.className='day empty';
    wrap.appendChild(d);
  }
  for(let day=1; day<=ref.days; day++){
    const weekday = (ref.startWeekday + day - 1) % 7;
    const isToday = (REAL_TODAY.y===MONTH_YEAR && REAL_TODAY.m===currentMonth && REAL_TODAY.d===day);
    const holidayName = (HOLIDAYS[currentMonth] || {})[day];
    const cell = document.createElement('div');
    cell.className = 'day' + (weekday===0?' sun':'') + (weekday===6?' sat':'') + (holidayName?' holiday':'') + (isToday?' today':'');
    cell.onclick = () => openModal(day);

    let items = getEventsForDay(day).filter(it => activeMembers[it.key]);
    const maxShow = 3;
    let pillsHtml = items.slice(0,maxShow).map(it=>{
      const firstLine = it.ev.sakura.split("\n")[0];
      return `<div class="pill ${it.key}${it.ev.off?' off':''}">${firstLine}</div>`;
    }).join('');
    const moreHtml = items.length>maxShow ? `<div class="more">+${items.length-maxShow}件</div>` : '';

    cell.innerHTML = `
      <div class="num">${day}</div>
      ${holidayName ? `<div class="holiday-label">${holidayName}</div>` : ''}
      ${pillsHtml}
      ${moreHtml}
    `;
    wrap.appendChild(cell);
  }
}

const weekdayNames = ['日','月','火','水','木','金','土'];

function refFor(month){
  return PEOPLE.miori.data[month] || PEOPLE.haruma.data[month] || PEOPLE.kazoku.data[month];
}

function getAdjacentDay(month, day, delta){
  let newDay = day + delta;
  let newMonth = month;
  const idx = MONTHS.indexOf(month);
  if(newDay < 1){
    newMonth = MONTHS[(idx - 1 + MONTHS.length) % MONTHS.length];
    newDay = refFor(newMonth).days;
  } else if(newDay > refFor(month).days){
    newMonth = MONTHS[(idx + 1) % MONTHS.length];
    newDay = 1;
  }
  return { month: newMonth, day: newDay };
}

function openModal(day, month){
  if(month && month !== currentMonth){
    currentMonth = month;
    render();
  }
  const ref = PEOPLE.miori.data[currentMonth] || PEOPLE.haruma.data[currentMonth] || PEOPLE.kazoku.data[currentMonth];
  const weekday = (ref.startWeekday + day - 1) % 7;
  const modal = document.getElementById('modal');

  let blocks = '';
  const holidayName = (HOLIDAYS[currentMonth] || {})[day];
  if(holidayName){
    blocks += `<div class="block holiday"><div class="label">祝日</div><div class="txt">${holidayName}</div></div>`;
  }
  MEMBER_KEYS.forEach(key=>{
    if(!activeMembers[key]) return;
    const person = PEOPLE[key];
    const monthData = person.data[currentMonth];
    const ev = monthData ? monthData.events[day] : null;
    if(!ev) return;
    if(ev.sakura){
      blocks += `<div class="block ${key}"><div class="label">${person.label}</div><div class="txt">${ev.sakura}</div></div>`;
    }
    if(ev.baseball){
      const isCheerDay = ev.sakura && ev.sakura.includes('野球応援');
      const label = isCheerDay ? '野球応援・大会情報' : '参考：野球部の試合日程';
      blocks += `<div class="block"><div class="label">${label}</div><div class="txt">${ev.baseball}</div></div>`;
    }
    if(ev.other){
      blocks += `<div class="block"><div class="label">担当・備考</div><div class="txt">${ev.other}</div></div>`;
    }
    if(ev.school){
      blocks += `<div class="block school"><div class="label">学校行事</div><div class="txt">${ev.school}</div></div>`;
    }
  });
  if(!blocks){
    blocks = `<div class="empty-msg">この日の記載はありません</div>`;
  }

  const prevInfo = getAdjacentDay(currentMonth, day, -1);
  const nextInfo = getAdjacentDay(currentMonth, day, 1);

  modal.innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h2>${currentMonth}月${day}日</h2>
    <div class="wd">${weekdayNames[weekday]}曜日</div>
    ${blocks}
    <div class="day-nav">
      <button class="nav-btn" onclick="openModal(${prevInfo.day}, ${prevInfo.month})">← 前の日</button>
      <button class="nav-btn" onclick="openModal(${nextInfo.day}, ${nextInfo.month})">次の日 →</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

render();
</script>
